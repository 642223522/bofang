# 小视频 · 原生 iOS v2 —— GitHub Actions 免费云构建（未签名 .ipa，供侧载）
#
# 2026-11-25 22:0x CST 起，构建从 Codemagic 迁到 GitHub Actions（用户令：停用 Codemagic，后面用 GitHub）。
# 与 codemagic.yaml 等价的步骤：校验 → 工具链 → 图标 → xcodegen →
# 归档（未签名）→ 修已编好的 Info.plist（只写版本）→ 打包 IPA → 上传产物。
# Bundle ID 不再单独设步骤：Set Bundle ID 跑在 xcodegen 之前会被重写覆写
# （chunk-7 P0-17 已删），Bundle ID 只由 PRODUCT_BUNDLE_IDENTIFIER 在归档时传递。
# 构建产物：未签名的 AdultAsianHD-unsigned.ipa（Payload/AdultAsianHD.app 打包）。
# 未签名是故意的：安装时由 AltStore / Sideloadly / ESign 用用户自己的 Apple ID 重新签名。
# 构建过程不需要任何 Apple 证书或 Apple ID。仓库只放软件，不放 JS 脚本。
#
# 费用（用户立规矩：全部走免费的）：macOS runner 按 10 倍分钟计费，免费额度每月 2000 分钟。
# 一次构建约 2–5 分钟 runner 时间 ≈ 20–50 分钟额度；每月构建几次完全在免费额度内。
# 触发只限 main 分支且只当源码/工作流变化时（paths 过滤），避免无关推送浪费额度。
# 产物保留 7 天（免费存储 500MB，IPA 约 1.8MB）。
#
# 构建机（2026-11-26 Duo 黑边根因）：原来 runs-on: macos-latest，镜像里只有
# Xcode 26.0–26.6，run #8 实测用 Xcode 26.6（iOS 26.5 SDK）编出来，Duo 内外屏
# 都被装进黑边盒子；老版 Codemagic 钉死 Xcode 27.2 才是满屏。苹果分档：iOS 26 SDK
# 内屏居中留空，iOS 27 SDK 占大半屏，只有 iOS 27.1+ 才满屏到边。所以改用官方
# xcode-27 标签（macOS 27 + Xcode 27，Apple Silicon，标准尺寸，计费与 macos-latest
# 一样；不要用 xcode-27-xlarge），工具链钉死 Xcode 27.2（/Applications/Xcode_27.2.app），
# 找不到就直接失败，绝不悄悄回落到旧版或 beta；构建前后都断言 SDK 是 27.1+。

name: iOS unsigned IPA (sideload)

on:
  push:
    branches: [main]
    paths:
      - 'AdultAsianHD/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  workflow_dispatch:

env:
  BUNDLE_ID: com.liudehen.xiaoshipin
  XCODE_PROJECT: AdultAsianHD/AdultAsianHD.xcodeproj
  XCODE_SCHEME: AdultAsianHD
  INFO_PLIST: AdultAsianHD/AdultAsianHD/Info.plist
  APP_NAME: AdultAsianHD
  IPA_NAME: AdultAsianHD-unsigned.ipa
  BUILD_DIR: build

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout（打印 HEAD 提交与 MARKETING_VERSION）
        run: |
          set -eo pipefail
          echo "--- git ---"
          git rev-parse HEAD
          git log --oneline -3
          echo "--- 源码版本号（应与本次提交一致） ---"
          grep "MARKETING_VERSION" AdultAsianHD/project.yml
          echo "--- 确认包里没有 .js（不内置源） ---"
          if find AdultAsianHD -name '*.js' -print -quit | grep -q .; then
            echo "❌ 仓库里发现 .js 文件，JS 脚本只放码云，不进 GitHub。"
            exit 1
          fi
          echo "OK：没有 .js 文件。"

      - name: Show toolchain（钉死 Xcode 27.2，Duo 内屏要 iOS 27.1+ SDK）
        run: |
          set -eo pipefail
          echo "--- 可用的 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_27_2="/Applications/Xcode_27.2.app"
          if [ ! -d "$XCODE_27_2" ]; then
            echo "❌ 找不到 Xcode 27.2：$XCODE_27_2，停止构建（绝不悄悄回落到旧版或 beta）。"
            exit 1
          fi
          echo "选用 Xcode 27.2：$XCODE_27_2"
          sudo xcode-select -s "$XCODE_27_2/Contents/Developer"
          xcodebuild -version
          echo "--- SDK 版本（应为 iphoneos27.1+，27.0 会留 Duo 内屏黑边） ---"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$SDK_VER" in
            27.[1-9]*|27.[0-9][0-9]*) echo "OK：SDK $SDK_VER";;
            *) echo "❌ SDK 不是 27.1+（当前：$SDK_VER），停止构建。"; exit 1;;
          esac
          echo "--- repo layout ---"
          ls -la

      - name: Generate AppIcon PNGs from source（base64 还原 + sips 切 12 个尺寸）
        run: |
          set -eo pipefail
          # 图标源图只以 base64 文本进仓（AdultAsianHD/icon-source.jpg.b64），12 张 PNG 在构建机上现切，
          # 不进 GitHub。源图：兔子+熊猫骑小摩托、红字“老司机带带我”。
          # 注意：.b64 不能放在 AppIcon.appiconset 内（actool unassigned children 告警），
          # 临时 JPG 也不能解码进 appiconset——一律走 /tmp，用完即删（chunk-7 P0-16）。
          ICONSET="AdultAsianHD/AdultAsianHD/Assets.xcassets/AppIcon.appiconset"
          B64="AdultAsianHD/icon-source.jpg.b64"
          JPG="/tmp/icon-source.jpg"
          if [ ! -f "$B64" ]; then
            echo "❌ 找不到图标 base64 源：$B64"
            exit 1
          fi
          openssl base64 -d -in "$B64" -out "$JPG"
          echo "--- 源图已还原 ---"
          sips -g pixelWidth -g pixelHeight "$JPG"
          for SIZE in 20 29 40 58 60 80 87 120 152 167 180 1024; do
            sips -s format png -z "$SIZE" "$SIZE" "$JPG" --out "$ICONSET/icon-$SIZE.png" >/dev/null
          done
          echo "--- 生成的图标 PNG ---"
          ls -lh "$ICONSET"/icon-*.png
          for SIZE in 20 29 40 58 60 80 87 120 152 167 180 1024; do
            if [ ! -f "$ICONSET/icon-$SIZE.png" ]; then
              echo "❌ 缺少图标 PNG：icon-$SIZE.png"
              exit 1
            fi
            # sips 不按 --out 后缀自动转格式：缺 -s format png 时产出的是 JPEG 数据伪装的 .png，
            # 必须逐张验真 PNG，否则停止构建（chunk-7 P0-16）。
            if ! file "$ICONSET/icon-$SIZE.png" | grep -q 'PNG image data'; then
              echo "❌ 图标不是真 PNG：icon-$SIZE.png（sips 未按 PNG 写出）"
              file "$ICONSET/icon-$SIZE.png" || true
              exit 1
            fi
          done
          rm -f "$JPG"
          echo "OK：12 个尺寸图标 PNG 已生成（均为真 PNG），临时源图已清理。"

      - name: Generate Xcode project (xcodegen)
        run: |
          set -eo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "安装 xcodegen..."
            brew install xcodegen
          fi
          xcodegen --version
          cd AdultAsianHD
          xcodegen generate
          echo "--- 生成的工程 ---"
          ls -la AdultAsianHD.xcodeproj/

      - name: Build (archive, unsigned)
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$BUILD_DIR"
          # 强制干净构建：删掉 DerivedData，杜绝增量编译复用旧目标文件。
          rm -rf ~/Library/Developer/Xcode/DerivedData
          echo "--- DerivedData 已清空 ---"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/$BUILD_DIR/AdultAsianHD.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]=" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee "$GITHUB_WORKSPACE/$BUILD_DIR/xcodebuild.log"
          echo "--- archived app ---"
          ls -lh "$GITHUB_WORKSPACE/$BUILD_DIR/AdultAsianHD.xcarchive/Products/Applications/"

      - name: Fix built Info.plist（只写版本）
        run: |
          set -eo pipefail
          # 直接在已编好的 .app 上用 PlistBuddy 改最终产物，不依赖构建配置
          # 是否采纳了源码 Info.plist / project.yml 的 INFOPLIST_KEY_*。
          # App 未签名，改 plist 不会破坏签名（安装时由侧载工具重签）。
          # 版本号只从 project.yml 的 MARKETING_VERSION / CURRENT_PROJECT_VERSION 读，不写死，防漂移。
          # 2026-11-28 chunk-7 P0-17：显示名、方向键（iPhone/iPad）、后台模式、ATS
          # 已全部迁入 project.yml 的 info.properties，由 xcodegen generate 写进 Info.plist，
          # 本步骤不再写这些键——PlistBuddy Add 会在数组已存在时重复插入，且与源头配置
          # 双写迟早漂移。只留 project.yml 管不到的版本号在这里强制写；其余键由
          # Package IPA 门禁在最终 .app 上硬断言（缺失/不对直接停止打包）。
          # ATS 特别注意：只留 NSAllowsArbitraryLoads=true（在 info.properties 里），
          # 绝不能在这里补 NSAllowsArbitraryLoadsInWebContent——它一出现就会让系统
          # 忽略 NSAllowsArbitraryLoads，回环代理与 http:// 流报 -1022（P0-15）。
          VERSION="$(grep "MARKETING_VERSION" AdultAsianHD/project.yml | grep -oE '1\.[0-9]*\.[0-9]*' | head -1)"
          BUILD_NUM="$(grep "CURRENT_PROJECT_VERSION" AdultAsianHD/project.yml | grep -oE '[0-9]+' | head -1)"
          if [ -z "$VERSION" ] || [ -z "$BUILD_NUM" ]; then
            echo "❌ project.yml 里没找到 MARKETING_VERSION 或 CURRENT_PROJECT_VERSION。"
            exit 1
          fi
          echo "写入版本：$VERSION ($BUILD_NUM)"
          APP_PATH="$GITHUB_WORKSPACE/$BUILD_DIR/AdultAsianHD.xcarchive/Products/Applications/$APP_NAME.app"
          PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST"
          echo "--- 修复后的 Info.plist（以下 Print 只读校验：任一键缺失即直接失败，说明 info.properties 没生效） ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"

      - name: Package IPA
        run: |
          set -eo pipefail
          APP_PATH="$GITHUB_WORKSPACE/$BUILD_DIR/AdultAsianHD.xcarchive/Products/Applications/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ 找不到 .app：$APP_PATH"
            echo "   先看上一步的 xcodebuild.log 找报错。"
            exit 1
          fi
          echo "--- 主屏显示名（应为 我的私人影院，否则停止打包） ---"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          echo "显示名：$DISPLAY_NAME"
          if [ "$DISPLAY_NAME" != "我的私人影院" ]; then
            echo "❌ 主屏显示名不是 我的私人影院（当前：$DISPLAY_NAME），停止打包。"
            exit 1
          fi
          echo "OK：主屏显示名是 我的私人影院。"
          echo "--- binary arch (expect arm64 only) ---"
          LIPO_INFO="$(lipo -info "$APP_PATH/$APP_NAME")"
          echo "$LIPO_INFO"
          if ! echo "$LIPO_INFO" | grep -q 'arm64'; then
            echo "❌ 二进制不是 arm64：$LIPO_INFO，停止打包。"
            exit 1
          fi
          if echo "$LIPO_INFO" | grep -q 'x86_64'; then
            echo "❌ 二进制混入 x86_64（应只含 arm64）：$LIPO_INFO，停止打包。"
            exit 1
          fi
          echo "OK：二进制是 arm64。"
          echo "--- 二进制里的版本串（应与 MARKETING_VERSION 一致，否则构建用的还是旧代码，直接失败） ---"
          EXPECTED_VERSION="$(grep "MARKETING_VERSION" AdultAsianHD/project.yml | grep -oE '1\.[0-9]*\.[0-9]*' | head -1)"
          if [ -z "$EXPECTED_VERSION" ]; then
            echo "❌ project.yml 里没找到 MARKETING_VERSION，停止打包。"
            exit 1
          fi
          echo "源码版本（MARKETING_VERSION）：$EXPECTED_VERSION"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          echo "包里版本号（Info.plist）：$PLIST_VERSION"
          if [ "$PLIST_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ 包里版本号 $PLIST_VERSION 与源码 $EXPECTED_VERSION 不一致，停止打包。"
            exit 1
          fi
          echo "OK：包里版本与源码一致。"
          echo "--- SDK 版本门禁（Duo 内屏要 iOS 27.1+ SDK，否则黑边；不是 27.1+ 就停止打包） ---"
          DT_PLATFORM="$(/usr/libexec/PlistBuddy -c "Print :DTPlatformVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          echo "DTPlatformVersion：$DT_PLATFORM"
          case "$DT_PLATFORM" in
            27.[1-9]*|27.[0-9][0-9]*) echo "OK：SDK $DT_PLATFORM";;
            *) echo "❌ DTPlatformVersion 不是 27.1+（当前：$DT_PLATFORM），停止打包。"; exit 1;;
          esac
          echo "--- 二进制里的版本串（仅供参考，不作门禁） ---"
          grep -a -oE '1\.[0-9]*\.[0-9]*' "$APP_PATH/$APP_NAME" | sort | uniq | tr '\n' ' ' || true
          echo "--- codesign check (expect: not signed) ---"
          if codesign --verify "$APP_PATH" 2>/dev/null; then
            echo "⚠️ 注意：.app 带签名（预期是未签名），继续打包。"
          else
            echo "OK：.app 未签名，符合预期（安装时由侧载工具重签）。"
          fi
          echo "--- AppIcon 检查（Assets.car 应在 .app 里，否则桌面图标空白） ---"
          if [ -f "$APP_PATH/Assets.car" ]; then
            echo "OK：Assets.car 在包里（AppIcon 已编入）。"
            ls -lh "$APP_PATH/Assets.car"
          else
            echo "❌ .app 里没有 Assets.car，AppIcon 没编进去，桌面图标会是空白。"
            exit 1
          fi
          echo "--- 打包门禁（chunk-7 P1-1：最终 .app 硬断言，任一项不符直接停止打包） ---"
          # 版本锁：1.0.3 / build 4，不升（project.yml 的值本身也要锁死，防漂移）。
          if [ "$EXPECTED_VERSION" != "1.0.3" ]; then
            echo "❌ 源码版本不是锁定的 1.0.3（当前：$EXPECTED_VERSION），停止打包。"
            exit 1
          fi
          BUILD_NUM="$(grep "CURRENT_PROJECT_VERSION" AdultAsianHD/project.yml | grep -oE '[0-9]+' | head -1)"
          if [ "$BUILD_NUM" != "4" ]; then
            echo "❌ 源码 build 不是锁定的 4（当前：$BUILD_NUM），停止打包。"
            exit 1
          fi
          PLIST_BUILD="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          if [ "$PLIST_BUILD" != "4" ]; then
            echo "❌ 包里 CFBundleVersion 不是 4（当前：$PLIST_BUILD），停止打包。"
            exit 1
          fi
          echo "OK：版本锁 1.0.3 / build 4。"
          # Bundle ID。
          PLIST_BUNDLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          if [ "$PLIST_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "❌ 包里 Bundle ID 不是 $BUNDLE_ID（当前：$PLIST_BUNDLE），停止打包。"
            exit 1
          fi
          echo "OK：Bundle ID 是 $BUNDLE_ID。"
          # 最低系统版本 17.0。
          PLIST_MINOS="$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          if [ "$PLIST_MINOS" != "17.0" ]; then
            echo "❌ 包里 MinimumOSVersion 不是 17.0（当前：$PLIST_MINOS），停止打包。"
            exit 1
          fi
          echo "OK：MinimumOSVersion 是 17.0。"
          # 启动屏（缺它 iOS 把 App 跑在兼容模式小窗口里，Duo 内屏黑边）。
          if ! /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "❌ 包里缺 UILaunchScreen，停止打包。"
            exit 1
          fi
          echo "OK：UILaunchScreen 在包里。"
          # 支持方向：iPhone 必须含竖屏 + 左右横屏。
          ORIENTATIONS="$(/usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          for WANT in UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight; do
            if ! echo "$ORIENTATIONS" | grep -q "$WANT"; then
              echo "❌ 包里方向键缺 $WANT（当前：$ORIENTATIONS），停止打包。"
              exit 1
            fi
          done
          echo "OK：方向键含 Portrait + LandscapeLeft + LandscapeRight。"
          # 后台模式：仅 fetch，严禁 audio（audio 会在灵动岛弹 Now Playing 大卡片）。
          BG_MODES="$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist" 2>/dev/null || echo MISSING)"
          if ! echo "$BG_MODES" | grep -q 'fetch'; then
            echo "❌ 包里后台模式缺 fetch（当前：$BG_MODES），停止打包。"
            exit 1
          fi
          if echo "$BG_MODES" | grep -q 'audio'; then
            echo "❌ 包里后台模式含 audio（当前：$BG_MODES），停止打包。"
            exit 1
          fi
          echo "OK：后台模式仅 fetch，无 audio。"
          # 最终 .app 内 0 个 .js（只查源码目录不够，必须查产物）。
          if find "$APP_PATH" -name '*.js' -print -quit | grep -q .; then
            echo "❌ 最终 .app 里发现 .js 文件："
            find "$APP_PATH" -name '*.js'
            exit 1
          fi
          echo "OK：最终 .app 内 0 个 .js。"
          # 5 个 .txt 资源必须在最终 .app 内且非空（Core/ 下的 JS 库与胶水以 .txt 进包，
          # 代码用 Bundle.main.url(forResource:withExtension: "js.txt") 在包根目录取用）。
          for TXT in hls.min.js.txt dash.min.js.txt cheerio.min.js.txt WidgetHTML.js.txt WidgetCrypto.js.txt; do
            if [ ! -s "$APP_PATH/$TXT" ]; then
              echo "❌ 最终 .app 里缺失或为空的 .txt 资源：$TXT，停止打包。"
              exit 1
            fi
          done
          echo "OK：5 个 .txt 资源都在最终 .app 内且非空。"
          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "$IPA_NAME" Payload
          rm -rf Payload
          echo "--- ipa ---"
          ls -lh "$IPA_NAME"
          unzip -l "$IPA_NAME" | head -20
          shasum -a 256 "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdultAsianHD-unsigned
          path: AdultAsianHD-unsigned.ipa
          retention-days: 7
