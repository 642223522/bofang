# xcodegen 规格（v2 重建，1.0.0）：由 xcodegen 在构建机上生成 AdultAsianHD.xcodeproj。
# 结构参考旧工程的 project.yml，只借结构，不抄业务配置。
# project.yml 放在 AdultAsianHD/ 目录下，生成出的 .xcodeproj 就在同目录，
# 与 codemagic.yaml 引用的 AdultAsianHD/AdultAsianHD.xcodeproj 一致。
# 注意：包里不带任何 .js（不内置源），Sources 目录不存在；
# NSAppTransportSecurity 不在这里写死，由 codemagic 在已编好的 .app 上修。
name: AdultAsianHD
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  AdultAsianHD:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AdultAsianHD/App
      - path: AdultAsianHD/Core
      - path: AdultAsianHD/Views
    info:
      path: AdultAsianHD/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.liudehen.xiaoshipin
      PRODUCT_NAME: "$(TARGET_NAME)"
      MARKETING_VERSION: "1.0.1"
      CURRENT_PROJECT_VERSION: "2"
      INFOPLIST_KEY_CFBundleDisplayName: "我的私人影院"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
      INFOPLIST_KEY_CFBundleVersion: "1"
      INFOPLIST_KEY_UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
