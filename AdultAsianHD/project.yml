# xcodegen 规格（v2 重建，1.0.0）：由 xcodegen 在构建机上生成 AdultAsianHD.xcodeproj。
# 结构参考旧工程的 project.yml，只借结构，不抄业务配置。
# project.yml 放在 AdultAsianHD/ 目录下，生成出的 .xcodeproj 就在同目录，
# 与 codemagic.yaml 引用的 AdultAsianHD/AdultAsianHD.xcodeproj 一致。
# 注意：包里不带任何 .js（不内置源），Sources 目录不存在；
# NSAppTransportSecurity 不在这里写死，由 codemagic 在已编好的 .app 上修。
name: AdultAsianHD
options:
  deploymentTarget:
    iOS: "17.0"
# 软解内核（C 路 Wave 2）：KSPlayer（FFmpeg），SPM 接入。
# product / module 名均为 KSPlayer，与 Core/PlayerEngine.swift 的
# `#if canImport(KSPlayer)` 判断一致；from "2.3.4"（2026-11-25 实测：
# 5.6.2 是预编译二进制（.binaryTarget + Sources/KSPlayer.xcframework），
# 其 xcframework 没有 iOS 切片，#57 归档时报 "no library for this platform"；
# 2.3.4 是源码 target（Swift + FFmpegKit from 6.1.3），编出来自带 iOS 库，
# 且代码里用的 KSPlayer API（KSPlayerLayer/KSOptions/firstPlayerType 等）
# 本就是 2.x 时代的接口，与 2.3.4 更对得上。若 2.3.4 仍编不过（API 对不上），
# 退路是直接去掉 KSPlayer 依赖——代码有 #if canImport 兜底，软解缺席也能编过）。
# 传递依赖 FFmpegKit（from 6.1.3）由 KSPlayer 自己的 Package.swift 拉，
# 这里不用另声明。版本 1.0.3 / build 4 与 Bundle ID 一字不动。
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    from: "2.3.4"
targets:
  AdultAsianHD:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AdultAsianHD/App
      - path: AdultAsianHD/Core
      - path: AdultAsianHD/Views
      - path: AdultAsianHD/Assets.xcassets
    dependencies:
      - package: KSPlayer
    info:
      path: AdultAsianHD/Info.plist
      # 启动屏（2026-11-25 根因：没有它 iOS 就把 App 跑在兼容模式的小窗口里，
      # Duo 展开的大屏上四周全是大黑边；旧录屏看着满屏只是因为外屏尺寸恰好
      # 跟兼容窗口一样大。UILaunchScreen 空字典 = 系统自动生成的启动屏，
      # 浅/深色自适应；iOS 27 SDK 起启动屏是硬要求（ITMS-90870）。
      # 注意：必须写在这里（info.properties），不能只改 Info.plist 文件——
      # xcodegen 每次 generate 都会按这里重写 Info.plist，手改的 key 会被悄悄删掉。
      properties:
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.liudehen.xiaoshipin
      PRODUCT_NAME: "$(TARGET_NAME)"
      MARKETING_VERSION: "1.0.3"
      CURRENT_PROJECT_VERSION: "4"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: "我的私人影院"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.0.3"
      INFOPLIST_KEY_CFBundleVersion: "4"
      INFOPLIST_KEY_UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
